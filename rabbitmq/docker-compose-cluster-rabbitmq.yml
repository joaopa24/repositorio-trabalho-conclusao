# Cluster RabbitMQ de 3 nós — usado nos cenários avançados 2 (Replicação) e 3 (Falha de broker).
# Mesma imagem do compose de broker único (rabbitmq:3.12-management).
# Coloque o arquivo rabbitmq-cluster.conf na MESMA pasta deste compose.
#
# O "name" abaixo põe estes containers num projeto próprio (rabbitmq-cluster), separado do
# broker único (projeto "rabbitmq"), mesmo com os dois arquivos na mesma pasta.
#
# Antes de subir, pare o compose de broker único para liberar memória:
#   docker compose down                                            (broker único)
#   docker compose -f docker-compose-cluster-rabbitmq.yml up -d    (cluster)
# Para desligar o cluster:
#   docker compose -f docker-compose-cluster-rabbitmq.yml down
# Conferir se os 3 nós formaram o cluster:
#   docker exec rabbit-1 rabbitmqctl cluster_status   (Running Nodes: rabbit@rabbit-1, -2, -3)
#
# AMQP: 127.0.0.1:5681, 5682, 5683 · Management: http://localhost:15681, 15682, 15683 (guest/guest)
# Os nomes dos containers (rabbit-1..3) precisam bater com os nós (rabbit@rabbit-1..3):
# o Cenário 3 derruba o container do nó líder da fila.

name: rabbitmq-cluster

x-rabbit: &rabbit
  image: rabbitmq:3.12-management
  environment:
    # mesmo "cookie" em todos os nós: é a senha que permite que eles formem o cluster
    RABBITMQ_ERLANG_COOKIE: "tcc-benchmark-cookie"
  volumes:
    - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro

services:
  rabbit-1:
    <<: *rabbit
    hostname: rabbit-1
    container_name: rabbit-1
    ports: ["5681:5672", "15681:15672"]

  rabbit-2:
    <<: *rabbit
    hostname: rabbit-2
    container_name: rabbit-2
    ports: ["5682:5672", "15682:15672"]

  rabbit-3:
    <<: *rabbit
    hostname: rabbit-3
    container_name: rabbit-3
    ports: ["5683:5672", "15683:15672"]
